# Intel CI settings for dpctl, see ci/README.md
version: 1
workflow: intel-ci.yml
artifacts:
  conda: "dpctl {platform} Python {python}"
  wheel: "dpctl {platform} Wheels Python {python}"
test:
  # The compilers build the extensions two tests compile; intel-opencl-rt is the OpenCL CPU device.
  requires: [pytest, cython, setuptools, intel-opencl-rt, c-compiler, cxx-compiler]
  # A wheel's environment has the system's compilers only, and the SYCL runtime comes with the wheel.
  wheel_requires: [pytest, cython, setuptools, intel-opencl-rt]
benchmark:
  # PyYAML, which asv needs, has no PyPI wheel for every Python the recipe declares.
  requires: [numpy, intel-opencl-rt, pyyaml]
  # conda-forge lacks asv for some Python the recipe declares; the abi3 wheel on PyPI fits all.
  pip_requires: [asv]
