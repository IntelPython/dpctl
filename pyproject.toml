[build-system]
build-backend = "setuptools.build_meta"
requires = [
  # TODO: keep in sync with [project.dependencies]
  "wheel>=0.43",
  "build>=1.1",
  "setuptools>=63.0.0",
  "scikit-build>=0.17.0,<1.0",
  "ninja>=1.11.1; platform_system!='Windows'",
  "cmake>=3.29.0",
  "cython>=3.1.0",
  "numpy >=1.26.0",
  # WARNING: check with doc how to upgrade
  "versioneer[toml]==0.29"
]

[project]
authors = [{ name = "Intel Corporation", email = "scripting@intel.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: C",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX",
  "Operating System :: Unix"
]
dependencies = [
  # TODO: keep in sync with [build-system.requires] and /conda-recipe/meta.yaml
  # This restrictions are for dependabot, actual restrictions are set with
  # conda.
  # TODO: populate it during build process
  # TODO: do we have to set sycl runtime dependencies here
  # "dpcpp-cpp-rt>=0.59.0",
  # "intel-cmplr-lib-rt>=0.59.0"
  "numpy>=2.0.0"
]
description = "A lightweight Python wrapper for a subset of SYCL."
dynamic = ["version"]
keywords = [
  "dpctl",
  "intel",
  "oneapi",
  "dpcpp"
]
license = "Apache-2.0"
name = "dpctl"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

[project.optional-dependencies]
benchmark = ["asv>=0.6", "numpy"]
coverage = ["Cython>=3.1.0", "pytest", "coverage", "tomli"]
docs = [
  "Cython>=3.1.0",
  "graphviz",
  "pydot",
  "furo",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-googleanalytics",
  "sphinxcontrib-jsmath",
  "sphinxcontrib-programoutput",
  "sphinxcontrib-spelling"
]

[project.urls]
Changelog = "https://github.com/IntelPython/dpctl/blob/master/CHANGELOG.md"
Documentation = "https://intelpython.github.io/dpctl/"
Homepage = "https://github.com/IntelPython/dpctl"
Issues = "https://github.com/IntelPython/dpctl/issues"
Repository = "https://github.com/IntelPython/dpctl.git"

[tool.black]
exclude = "dpctl/_version.py"
line-length = 80

[tool.cibuildwheel]
build-verbosity = 1

[tool.cibuildwheel.linux]
# Intel's icx, as the conda recipe builds with, from Intel's repository, and the Level Zero headers
before-all = [
  "rpm --import https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB",
  "printf '[oneAPI]\\nname=Intel oneAPI\\nbaseurl=https://yum.repos.intel.com/oneapi\\nenabled=1\\ngpgcheck=1\\nrepo_gpgcheck=1\\ngpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB\\n' > /etc/yum.repos.d/oneAPI.repo",
  "dnf install -y intel-oneapi-compiler-dpcpp-cpp-2026.2",
  "git clone --depth 1 --branch v1.34.0 https://github.com/oneapi-src/level-zero /opt/level-zero"
]
# LDFLAGS gives libDPCTLSyclInterface the full RELRO the extensions link with
environment = { CC = "/opt/intel/oneapi/compiler/latest/bin/icx", CXX = "/opt/intel/oneapi/compiler/latest/bin/icpx", CMAKE_GENERATOR = "Ninja", CMAKE_ARGS = "-DDPCTL_LEVEL_ZERO_INCLUDE_DIR=/opt/level-zero/include -DDPCTL_WITH_REDIST=ON", LDFLAGS = "-Wl,-z,relro -Wl,-z,now" }
# The SYCL and icx runtime libraries come from wheels at run time, see [tool.gh-ci];
# libsycl matches any soname, as wheel-requires allows any 2026 runtime
repair-wheel-command = "auditwheel repair --exclude 'libsycl.so.*' --exclude libintlc.so.5 --exclude libimf.so --exclude libsvml.so --exclude libirng.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
# icx from conda-forge, and the Level Zero headers
before-all = [
  "python {project}/ci/install_icx.py C:/icx",
  "git clone --depth 1 --branch v1.34.0 https://github.com/oneapi-src/level-zero C:/level-zero"
]
environment = { CC = "C:/icx/Library/bin/icx.exe", CXX = "C:/icx/Library/bin/icx.exe", CMAKE_GENERATOR = "Ninja", CMAKE_ARGS = "-DDPCTL_LEVEL_ZERO_INCLUDE_DIR=C:/level-zero/include -DCMAKE_INTERPROCEDURAL_OPTIMIZATION:BOOL=FALSE", PATH = "C:/icx/Library/bin;C:/icx/Library/bin/compiler;$PATH", LIB = "C:/icx/Library/lib;$LIB", LINK = "/LIBPATH:C:/icx/Library/lib" }
# The SYCL and icx runtime libraries come from wheels at run time, see [tool.gh-ci];
# sycl matches any version, as wheel-requires allows any 2026 runtime
repair-wheel-command = "delvewheel repair --no-dll DPCTLSyclInterface.dll;sycl*.dll;irc_msg.dll;libmmd.dll;svml_dispmd.dll;libircmd.dll;libirngmd.dll;ze_loader.dll;OpenCL.dll -w {dest_dir} {wheel}"

[tool.codespell]
builtin = "clear,rare,informal,names"
check-filenames = true
ignore-words-list = "nd"
quiet-level = 3

[tool.coverage.report]
omit = [
  "dpctl/tests/*",
  "dpctl/_version.py",
  "*/_cython_api*/stringsource"
]

[tool.coverage.run]
branch = true
omit = [
  "dpctl/tests/*",
  "dpctl/_version.py",
  "*/_cython_api*/stringsource"
]
plugins = [
  "Cython.Coverage"
]
source = [
  "dpctl"
]

[tool.cython-lint]
max-line-length = 80

[tool.gh-ci]
# What the wheels need at run time, which conda packages get from the recipe
wheel-requires = ["intel-sycl-rt >=2026.2,<2027", "intel-cmplr-lib-rt >=2026.2,<2027"]

[tool.isort]
ensure_newline_before_comments = true
force_grid_wrap = 0
include_trailing_comma = true
line_length = 80
multi_line_output = 3
skip = ["dpctl/_version.py"]
use_parentheses = true

[tool.pytest.ini_options]
addopts = [
  "--junitxml=junit.xml",
  "--ignore=setup.py",
  "--ignore=run_test.py",
  "--tb=native",
  "--strict-markers",
  "--durations=20",
  "-q",
  "-ra"
]
markers = [
  "broken_complex: mark a test that is skipped due to complex implementation issues in DPC++ compiler"
]
minversion = "6.0"
norecursedirs = [
  ".*",
  "*.egg*",
  "build",
  "dist",
  "conda-recipe"
]

[tool.versioneer]
VCS = "git"
parentdir_prefix = "dpctl-"
style = "pep440"
versionfile_build = "dpctl/_version.py"
versionfile_source = "dpctl/_version.py"
