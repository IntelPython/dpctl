[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "scikit-build-core>=0.11",
  "cython>=3.1",
  "cython-cmake>=0.2",
  "dpctl",
  "numpy"
]

[project]
authors = [{ name = "Intel Corporation" }]
dependencies = ["dpctl", "numpy"]
description = "An example of Cython extension calling SYCL Cython API"
license = "Apache-2.0"
name = "use_dpctl_sycl"
version = "0.0.0"

[project.urls]
Repository = "https://github.com/IntelPython/dpctl"
